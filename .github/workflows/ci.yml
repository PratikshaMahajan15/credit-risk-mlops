name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4          # PySpark tests need Java
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          MLFLOW_DISABLED: "1"
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f docker/Dockerfile.api -t credit-risk-api .
      - name: Build the Spark ETL image
        run: docker build -f docker/Dockerfile.spark -t credit-risk-spark-etl .

  publish:                                   # continuous delivery: publish the API image on every push to main
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case the owner name (registry names must be lower case)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/credit-risk-api:latest
            ghcr.io/${{ env.OWNER }}/credit-risk-api:${{ github.sha }}
