name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4          # PySpark tests need Java
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          MLFLOW_DISABLED: "1"
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f docker/Dockerfile.api -t credit-risk-api .
