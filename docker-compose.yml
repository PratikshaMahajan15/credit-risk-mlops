# Start the scoring API:   docker compose up --build
# The trained champion model is mounted from ./models, so train first (python -m src.train).
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      MODEL_DIR: /app/models/champion
      # ENABLE_LLM_EXPLANATION: "1"
      # GEMINI_API_KEY: ${GEMINI_API_KEY}
